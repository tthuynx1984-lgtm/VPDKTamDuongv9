<title>VPĐK Tam Dương</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Bố cục: thanh trên cùng (tên đơn vị + 3 mục), phía dưới là vùng làm việc của từng công cụ */
:root{--bg:#f3f6f7;--surface:#ffffff;--ink:#13222c;--muted:#5a6b76;--line:#d5dee3;--accent:#0b5a6b;--accent-ink:#ffffff;--tab-hover:#e8eef0;
--sans:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--surface:#17252d;--ink:#e6eef1;--muted:#93a6b0;--line:#2a3c46;--accent:#5fc1d4;--accent-ink:#0a1a20;--tab-hover:#1f323b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a20;--surface:#17252d;--ink:#e6eef1;--muted:#93a6b0;--line:#2a3c46;--accent:#5fc1d4;--accent-ink:#0a1a20;--tab-hover:#1f323b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:8px 0;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0;padding-block:2px 8px}
.logo{width:40px;height:40px;border-radius:9px;flex:none;display:block}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:1.05rem;font-weight:700;letter-spacing:.01em;color:var(--accent)}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.nav button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
.nav button:hover{background:var(--tab-hover);color:var(--ink)}
.nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative}
.mod{position:absolute;inset:0;overflow:auto}
.mod[hidden]{display:none}
@media (max-width:640px){.nav{margin-left:0;width:100%}.brand span{white-space:normal}}
/* hộp thoại thay cho alert / confirm / prompt */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg[hidden]{display:none}
.dlg form{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,100%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:.92rem}
.dlg input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg button{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:none;color:var(--accent)}
.dlg button.ok{background:var(--accent);color:var(--accent-ink)}
</style>

#cm{width:48px}
#pp{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;display:none;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bar);border:1px solid var(--bd);border-radius:10px;padding:8px}
#pp a,#pp button{text-decoration:none;color:#fff;background:var(--ac);border-color:var(--ac)}
#pp a{display:inline-flex;align-items:center;font:inherit;padding:6px 10px;min-height:34px;border:1px solid var(--ac);border-radius:8px;box-sizing:border-box}
#pp button{background:var(--bg);color:var(--fg);border-color:var(--bd)}
#pp span{flex:1 1 100%;font-size:12px}
#fw{display:none;background:#5a3d00;color:#fff;border:1px solid #e6a100;border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.45}
#fw button{margin-top:4px;padding:3px 10px;min-height:28px}
#dg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#dg>div{background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:12px;width:min(580px,100%);max-height:92vh;overflow:auto;font-size:13px}
#dgt{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:8px 0;max-height:60vh;overflow:auto}
#dg button{margin:3px 3px 0 0}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ed>div{background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:14px;width:min(420px,100%);font-size:14px}
#ed input{width:100%;box-sizing:border-box;margin:6px 0 10px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
#edm{color:#d33;min-height:1.2em;margin:0 0 6px}
#lc{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#lc>div{background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:14px;width:min(420px,100%);font-size:14px}
#lc textarea{width:100%;height:84px;box-sizing:border-box;margin:8px 0;font:12px monospace;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
#lc p{margin:4px 0}
#lcm{color:#d33;min-height:1.2em}
/* Menu chính: hàng 1 = tên, Mở, Thư viện, tìm kiếm; hàng 2 = nút chức năng. Nút có ▾ là NHÓM: bấm → dải lệnh con ngay dưới thanh, chọn xong dải tự ẩn, lệnh giữ nguyên. Nút không có ▾ là nút ĐỘC LẬP: bấm là làm ngay. */
/* Thửa đất */
#ov #subs #tbb{flex-wrap:nowrap;flex-direction:column;align-items:stretch}
#ov #subs #tbb>.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#ov #subs #tbb select{flex:1 1 90px;min-width:0;max-width:150px;text-overflow:ellipsis}
#ov #subs #tbb #tto{width:52px;height:30px;min-height:0;box-sizing:border-box;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:12px;padding:2px 6px}
#ov #mid #tp{left:0;right:0;bottom:0;display:none;max-height:74%;overflow:auto;box-sizing:border-box;background:var(--bar);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12.5px;z-index:5}
#tp .th,#te .th{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#tp .th b,#te .th b{flex:1;font-size:14px}
#tp .th button,#te .th button{min-height:30px;padding:2px 10px}
#tp .tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#tp .tg label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;min-width:0}
#tp .tg label.w{grid-column:1/-1}
#tp .tg .ts{grid-column:1/-1;font-size:12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd)}
#tp input{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;min-width:0}
#tp p{margin:8px 0;line-height:1.45}
#tp .tk{margin-top:6px;font-size:11px;opacity:.75}#tp .tk a{color:inherit;text-decoration:underline}#tp .tk label{display:inline-flex;align-items:center;gap:4px}
#tp .wn{color:#e6a100;font-weight:600}
#tp .tb{display:flex;flex-wrap:wrap;gap:6px}
#tp .tb button{min-height:34px;padding:4px 10px;font-size:13px}
#tp .tb button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#te{font-size:12.5px}
#te p{margin:4px 0}
#te label{display:flex;gap:6px;align-items:center;margin:4px 0}
#te details{margin:6px 0}
#te summary{cursor:pointer;font-weight:600;padding:3px 0}
#te .er{padding:6px;border-bottom:1px solid var(--bd);cursor:pointer;line-height:1.35}
#te .er:hover{background:var(--bg)}
/* Menu chính: hàng 1 = tên, Mở, Thư viện, tìm kiếm; hàng 2 = nút chức năng. Nút có ▾ là NHÓM: bấm → dải lệnh con ngay dưới thanh, chọn xong dải tự ẩn, lệnh giữ nguyên. Nút không có ▾ là nút ĐỘC LẬP: bấm là làm ngay. */
#fns{flex:1 1 100%;max-width:560px;min-width:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.bar #fns button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:42px;padding:2px 1px;font-size:10px;line-height:1.1;border-radius:7px;overflow:hidden}
#fns i{font-style:normal;font-size:16px;line-height:1.05}
#fns span{display:block;max-width:100%;text-align:center;word-break:break-word}
#fns .grb::after{content:"";position:absolute;right:3px;bottom:3px;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;opacity:.7}
#fns .grb.open::after{border-top:0;border-bottom:4px solid currentColor}
button.grb.on.open{box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--ac)}
#fns button.warn{border-color:#e6a100;box-shadow:inset 0 0 0 1px #e6a100}
#fns button.ok{border-color:#2e9e5b;color:#2e9e5b}
.bar select{min-height:28px;padding:2px 6px;font-size:12px;max-width:100px}
#ov{position:absolute;top:6px;left:6px;right:6px;bottom:6px;z-index:3;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#ov #subs{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;pointer-events:none}
#ov #subs>*{position:static;width:auto;max-width:none;box-sizing:border-box;margin:0;pointer-events:auto}
#ov #subs #gi{display:none;background:var(--bar);border:1px solid var(--bd);border-radius:10px;padding:5px 7px;font-size:12px;line-height:1.4}
#ov #subs #gi.w{border-color:#e6a100}
#ov #subs #gt{font-size:11px;line-height:1.4}
#ov #subs #sb{display:none;align-items:center;gap:4px;background:var(--bar);border:1px solid var(--bd);border-radius:10px;padding:4px 7px}
#ov #subs #sc{flex:1;min-width:0;font-size:12px;line-height:1.3}
#ov #subs .sg{display:none;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;background:var(--bar);border:1px solid var(--bd);border-radius:10px}
#ov #subs .sg button{flex:0 0 auto;min-height:30px;padding:3px 6px;font-size:12px;line-height:1.1;white-space:nowrap;border-radius:7px}
#ov #subs .sg label{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
#ov #subs .sg select,#ov #subs .sg input{min-height:30px;padding:2px 6px;font-size:12px}
#ov #subs #stb{flex-wrap:nowrap;flex-direction:column;align-items:stretch}
#ov #subs #stb>.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#ov #subs #stb select{flex:1 1 90px;min-width:0;max-width:170px;text-overflow:ellipsis}
#ov #mid{position:relative;flex:1 1 0;min-height:0;pointer-events:none}
#ov #mid>*{position:absolute;pointer-events:auto}
#ov #mid #rt{left:0;right:0;bottom:0;margin:0;padding:6px 8px;background:var(--bar);border:1px solid var(--bd);border-radius:10px;font-size:12px;line-height:1.35;pointer-events:none;z-index:2;display:none}
.app.ms-on #ov #mid #rt{display:block}
#rt b{font-size:14px}
#rt .w{color:#e6a100}

/* hộp thoại dùng chung */
#dlg{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;margin:0}
#dlg[hidden]{display:none}
#dlg>div{background:var(--bar);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(460px,100%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#dlg p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:14px}
#dlg input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#dlg button{min-height:38px;padding:6px 16px;font-weight:600}
#dlg button.ok{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- hộp thoại dùng chung (trình xem không hiện alert/confirm/prompt) ---------- */
function uiDialog(o){
  return new Promise(function(res){
    var f=document.getElementById('dlg'),box=f.firstElementChild;box.textContent='';
    var p=document.createElement('p');p.textContent=o.msg;box.appendChild(p);
    var inp=null;if(o.input){inp=document.createElement('input');inp.type='text';inp.id='dlgIn';inp.setAttribute('aria-label',o.msg);box.appendChild(inp)}
    var row=document.createElement('div');row.className='row';
    function done(v){f.hidden=true;f.onsubmit=null;f.onkeydown=null;res(v)}
    if(o.cancel){var c=document.createElement('button');c.type='button';c.textContent='Hủy';c.onclick=function(){done(null)};row.appendChild(c)}
    var k=document.createElement('button');k.type='submit';k.className='ok';k.textContent=o.ok||'Đồng ý';row.appendChild(k);box.appendChild(row);
    f.onsubmit=function(e){e.preventDefault();done(inp?inp.value:true)};
    f.onkeydown=function(e){if(e.key==='Escape')done(o.cancel?null:true)};
    f.hidden=false;(inp||k).focus();
  });
}
function uiAlert(m){return uiDialog({msg:m,ok:'Đã hiểu'}).then(function(){})}
function uiConfirm(m){return uiDialog({msg:m,cancel:true}).then(function(v){return v===true})}
function uiPrompt(m){return uiDialog({msg:m,input:true,cancel:true}).then(function(v){return typeof v==='string'?v:null})}

/* ---------- 1. Hồ sơ BPKT ---------- */
function mountBpkt(root){
/* ===================== ĐỌC FILE EXCEL (xlsx, xlsm, xls, ods, csv, tsv, html) ===================== */
const MAXCOL = 70;   // chỉ đọc tối đa 70 cột đầu của mỗi sheet

function xmlDecode(s) {
  return s.replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function attrs(s) { const o = {}; s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g, (_, k, v) => { o[k] = v; return ''; }); return o; }
function colLetters(s) { let n = 0; for (let i = 0; i < s.length; i++) n = n * 26 + s.charCodeAt(i) - 64; return n - 1; }
function finishRows(map, maxRow) {            // map: Map<row, Map<col,val>> -> mảng 2 chiều
  const rows = [];
  for (let r = 0; r <= maxRow; r++) {
    const m = map.get(r); if (!m) { rows.push([]); continue; }
    let mx = -1; m.forEach((_, c) => { if (c > mx) mx = c; });
    const arr = new Array(mx + 1).fill('');
    m.forEach((v, c) => arr[c] = v); rows.push(arr);
  }
  return rows;
}

// ---------- XLSX / XLSM ----------
async function readXlsx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const txt = async p => { const f = zip.file(p); return f ? await f.async('string') : ''; };
  const wbx = await txt('xl/workbook.xml');
  if (!wbx) throw new Error('Không phải file xlsx hợp lệ');
  const relx = await txt('xl/_rels/workbook.xml.rels');
  const rels = {}; (relx.match(/<Relationship\b[^>]*>/g) || []).forEach(t => { const a = attrs(t); rels[a.Id] = a.Target; });
  const sst = []; const sx = await txt('xl/sharedStrings.xml');
  if (sx) (sx.match(/<si\b[\s\S]*?<\/si>|<si\s*\/>/g) || []).forEach(si => {
    const clean = si.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    let out = ''; clean.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, t) => { out += t; return ''; });
    sst.push(xmlDecode(out));
  });
  const sheets = [];
  const defs = wbx.match(/<sheet\b[^>]*>/g) || [];
  for (const d of defs) {
    const a = attrs(d); let tgt = rels[a['r:id']]; if (!tgt) continue;
    tgt = tgt.replace(/^\/?(xl\/)?/, 'xl/');
    const xml = await txt(tgt); const map = new Map(); let maxRow = -1;
    const re = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
    while ((m = re.exec(xml))) {
      const at = m[1], body = m[2]; if (!body) continue;
      const rm = at.match(/\br="([A-Z]+)(\d+)"/); if (!rm) continue;
      const c = colLetters(rm[1]); if (c >= MAXCOL) continue;
      const r = +rm[2] - 1, tm = at.match(/\bt="(\w+)"/), t = tm ? tm[1] : 'n';
      let val = '';
      if (t === 'inlineStr') { let o = ''; body.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, x) => { o += x; return ''; }); val = xmlDecode(o); }
      else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (!vm) continue;
        if (t === 's') val = sst[+vm[1]] || ''; else if (t === 'str') val = xmlDecode(vm[1]);
        else if (t === 'e') val = ''; else if (t === 'b') val = vm[1] === '1' ? 'TRUE' : 'FALSE';
        else { val = parseFloat(vm[1]); if (isNaN(val)) val = xmlDecode(vm[1]); } }
      if (val === '') continue;
      let row = map.get(r); if (!row) { row = new Map(); map.set(r, row); }
      row.set(c, val); if (r > maxRow) maxRow = r;
    }
    sheets.push({ name: xmlDecode(a.name), rows: finishRows(map, maxRow), hidden: a.state === 'hidden' });
  }
  return sheets;
}

// ---------- ODS ----------
async function readOds(buf) {
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('content.xml'); if (!f) throw new Error('Không phải file ods hợp lệ');
  const xml = await f.async('string'); const sheets = [];
  const parts = xml.split(/<table:table\s/).slice(1);
  for (let part of parts) {
    const end = part.indexOf('</table:table>'); if (end >= 0) part = part.slice(0, end);
    const name = xmlDecode((part.match(/table:name="([^"]*)"/) || [, 'Sheet'])[1]);
    const map = new Map(); let r = 0, maxRow = -1;
    const rowRe = /<table:table-row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/table:table-row>)/g; let rm;
    while ((rm = rowRe.exec(part))) {
      const ra = attrs(rm[1]), rep = +(ra['table:number-rows-repeated'] || 1), body = rm[2] || '';
      const cells = new Map(); let c = 0;
      const cellRe = /<table:(covered-)?table-cell\b([^>]*?)(?:\/>|>([\s\S]*?)<\/table:(?:covered-)?table-cell>)/g; let cm;
      while ((cm = cellRe.exec(body))) {
        const ca = attrs(cm[2]), crep = +(ca['table:number-columns-repeated'] || 1), vt = ca['office:value-type'];
        let val = '';
        if (vt === 'float' || vt === 'percentage' || vt === 'currency') val = parseFloat(ca['office:value']);
        else if (vt === 'date') val = ca['office:date-value'] || '';
        else if (vt === 'boolean') val = ca['office:boolean-value'] === 'true' ? 'TRUE' : 'FALSE';
        else if (vt === 'string' || cm[3]) {
          if (ca['office:string-value'] != null) val = xmlDecode(ca['office:string-value']);
          else val = xmlDecode((cm[3] || '').replace(/<text:s\b[^>]*\/>/g, ' ').replace(/<\/text:p>\s*<text:p[^>]*>/g, '\n').replace(/<[^>]+>/g, ''));
        }
        if (val !== '' && !(typeof val === 'number' && isNaN(val))) for (let k = 0; k < Math.min(crep, 5) && c + k < MAXCOL; k++) cells.set(c + k, val);
        c += crep; if (c > 4000) break;
      }
      if (cells.size) { for (let k = 0; k < Math.min(rep, 1000); k++) map.set(r + k, cells); maxRow = Math.max(maxRow, r + Math.min(rep, 1000) - 1); }
      r += rep;
    }
    sheets.push({ name, rows: finishRows(map, maxRow), hidden: false });
  }
  return sheets;
}

// ---------- XLS (BIFF8) ----------
function readOLE(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
  if (!sig.every((b, i) => u8[i] === b)) throw new Error('Không phải file .xls hợp lệ');
  const ss = 1 << dv.getUint16(30, true), ms = 1 << dv.getUint16(32, true);
  const dirStart = dv.getUint32(48, true), cutoff = dv.getUint32(56, true), mfStart = dv.getUint32(60, true), dfStart = dv.getUint32(68, true), dfNum = dv.getUint32(72, true);
  const off = id => (id + 1) * ss, END = 0xFFFFFFF0;
  const difat = []; for (let i = 0; i < 109; i++) { const v = dv.getUint32(76 + i * 4, true); if (v < END) difat.push(v); }
  let d = dfStart; for (let i = 0; i < dfNum && d < END; i++) { const o = off(d); for (let j = 0; j < ss / 4 - 1; j++) { const v = dv.getUint32(o + j * 4, true); if (v < END) difat.push(v); } d = dv.getUint32(o + ss - 4, true); }
  const fat = []; difat.forEach(s => { const o = off(s); for (let j = 0; j < ss / 4; j++) fat.push(dv.getUint32(o + j * 4, true)); });
  const chain = (start, table) => { const out = []; let s = start, g = 0; while (s < END && g++ < 1e6) { out.push(s); s = table[s]; } return out; };
  const readChain = (start, size) => { const ids = chain(start, fat), out = new Uint8Array(ids.length * ss); ids.forEach((s, i) => out.set(u8.subarray(off(s), off(s) + ss), i * ss)); return size != null ? out.subarray(0, size) : out; };
  const dirBytes = readChain(dirStart); const ddv = new DataView(dirBytes.buffer, dirBytes.byteOffset, dirBytes.byteLength);
  const ents = [];
  for (let i = 0; i + 128 <= dirBytes.length; i += 128) {
    const nl = ddv.getUint16(i + 64, true); let name = ''; for (let k = 0; k < (nl - 2) / 2; k++) name += String.fromCharCode(ddv.getUint16(i + k * 2, true));
    ents.push({ name, type: dirBytes[i + 66], start: ddv.getUint32(i + 116, true), size: ddv.getUint32(i + 120, true) });
  }
  const root = ents[0]; let mini = null, miniFat = null;
  const stream = e => {
    if (e.size < cutoff) {
      if (!mini) { mini = readChain(root.start, root.size); const mf = readChain(mfStart); const mdv = new DataView(mf.buffer, mf.byteOffset, mf.byteLength); miniFat = []; for (let i = 0; i < mf.length / 4; i++) miniFat.push(mdv.getUint32(i * 4, true)); }
      const ids = chain(e.start, miniFat), out = new Uint8Array(ids.length * ms); ids.forEach((s, i) => out.set(mini.subarray(s * ms, s * ms + ms), i * ms)); return out.subarray(0, e.size);
    }
    return readChain(e.start, e.size);
  };
  const wbE = ents.find(e => e.type === 2 && (e.name === 'Workbook' || e.name === 'Book'));
  if (!wbE) throw new Error('Không tìm thấy dữ liệu bảng tính trong file .xls');
  return stream(wbE);
}

function readXls(buf) {
  const wb = readOLE(new Uint8Array(buf)); const dv = new DataView(wb.buffer, wb.byteOffset, wb.byteLength);
  const u16 = p => dv.getUint16(p, true), u32 = p => dv.getUint32(p, true);
  const recs = []; for (let p = 0; p + 4 <= wb.length;) { const id = u16(p), len = u16(p + 2); recs.push({ id, p: p + 4, len }); p += 4 + len; }
  // chuỗi dùng chung (SST) có thể bị chia qua các bản ghi CONTINUE
  const sst = [];
  const si = recs.findIndex(r => r.id === 0xFC);
  if (si >= 0) {
    const chunks = [{ p: recs[si].p + 8, e: recs[si].p + recs[si].len }];
    for (let k = si + 1; k < recs.length && recs[k].id === 0x3C; k++) chunks.push({ p: recs[k].p, e: recs[k].p + recs[k].len });
    const uniq = u32(recs[si].p + 4); let ci = 0, pos = chunks[0].p;
    const need = () => { while (pos >= chunks[ci].e && ci < chunks.length - 1) { ci++; pos = chunks[ci].p; } };
    const skip = n => { while (n > 0) { need(); const a = Math.min(n, chunks[ci].e - pos); if (a <= 0) break; pos += a; n -= a; } };
    for (let i = 0; i < uniq && ci < chunks.length; i++) {
      need(); const cch = u16(pos); const fl = wb[pos + 2]; pos += 3;
      let hi = fl & 1, runs = 0, ext = 0;
      if (fl & 8) { runs = u16(pos); pos += 2; } if (fl & 4) { ext = u32(pos); pos += 4; }
      let s = '', left = cch;
      while (left > 0) {
        if (pos >= chunks[ci].e) { if (ci < chunks.length - 1) { ci++; pos = chunks[ci].p; hi = wb[pos] & 1; pos++; } else break; }
        const bw = hi ? 2 : 1, avail = Math.floor((chunks[ci].e - pos) / bw), n = Math.min(left, avail);
        if (n <= 0) { pos = chunks[ci].e; continue; }
        for (let k = 0; k < n; k++) s += String.fromCharCode(hi ? u16(pos + k * 2) : wb[pos + k]);
        pos += n * bw; left -= n;
      }
      skip(runs * 4 + ext); sst.push(s);
    }
  }
  const bs = []; recs.forEach(r => { if (r.id === 0x85) { const type = wb[r.p + 5], cch = wb[r.p + 6], fl = wb[r.p + 7]; let name = '';
    for (let k = 0; k < cch; k++) name += String.fromCharCode((fl & 1) ? u16(r.p + 8 + k * 2) : wb[r.p + 8 + k]);
    bs.push({ off: u32(r.p), name, type, hidden: wb[r.p + 4] !== 0 }); } });
  const rk = v => { let n; if (v & 2) n = v >> 2; else { const b = new DataView(new ArrayBuffer(8)); b.setUint32(4, (v & 0xFFFFFFFC) >>> 0, true); n = b.getFloat64(0, true); } return (v & 1) ? n / 100 : n; };
  const sheets = [];
  for (const sh of bs) {
    if (sh.type !== 0) continue;
    const map = new Map(); let maxRow = -1, depth = 0, lastF = null;
    const put = (r, c, v) => { if (c >= MAXCOL || v === '' || v == null) return; let m = map.get(r); if (!m) { m = new Map(); map.set(r, m); } m.set(c, v); if (r > maxRow) maxRow = r; };
    const startIdx = recs.findIndex(r => r.p - 4 === sh.off);
    for (let k = startIdx; k >= 0 && k < recs.length; k++) {
      const r = recs[k], p = r.p;
      if (r.id === 0x809) { depth++; continue; } if (r.id === 0x0A) { depth--; if (depth <= 0) break; continue; }
      if (r.id === 0xFD) put(u16(p), u16(p + 2), sst[u32(p + 6)] || '');
      else if (r.id === 0x203) put(u16(p), u16(p + 2), dv.getFloat64(p + 6, true));
      else if (r.id === 0x27E) put(u16(p), u16(p + 2), rk(u32(p + 6)));
      else if (r.id === 0xBD) { const row = u16(p), c0 = u16(p + 2), n = (r.len - 6) / 6; for (let j = 0; j < n; j++) put(row, c0 + j, rk(u32(p + 4 + j * 6 + 2))); }
      else if (r.id === 0x204) { const cch = u16(p + 6), fl = wb[p + 8]; let s = ''; for (let j = 0; j < cch; j++) s += String.fromCharCode((fl & 1) ? u16(p + 9 + j * 2) : wb[p + 9 + j]); put(u16(p), u16(p + 2), s); }
      else if (r.id === 0x06) { const row = u16(p), col = u16(p + 2);
        if (wb[p + 12] === 0xFF && wb[p + 13] === 0xFF) { if (wb[p + 6] === 0) lastF = [row, col]; else if (wb[p + 6] === 1) put(row, col, wb[p + 8] ? 'TRUE' : 'FALSE'); }
        else put(row, col, dv.getFloat64(p + 6, true)); }
      else if (r.id === 0x207 && lastF) { const cch = u16(p), fl = wb[p + 2]; let s = ''; for (let j = 0; j < cch; j++) s += String.fromCharCode((fl & 1) ? u16(p + 3 + j * 2) : wb[p + 3 + j]); put(lastF[0], lastF[1], s); lastF = null; }
    }
    sheets.push({ name: sh.name, rows: finishRows(map, maxRow), hidden: sh.hidden });
  }
  return sheets;
}

// ---------- CSV / TSV / HTML ----------

async function csvDownload(name, rows) {
  const t = '\uFEFF' + rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  if (window.claude && claude.use) {
    try { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: t }); return; } }
    catch (e) { if (e && e.code !== 'unavailable') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

['dragenter', 'dragover'].forEach(ev => root.addEventListener(ev, e => { e.preventDefault(); APP.classList.add('dragging'); }));
['dragleave', 'drop'].forEach(ev => root.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement || !e.relatedTarget) APP.classList.remove('dragging'); }));
root.addEventListener('drop', async e => {
  const items = [...(e.dataTransfer.items || [])].filter(i => i.kind === 'file'), files = [...(e.dataTransfer.files || [])];
  const hs = []; for (const it of items) { try { hs.push(it.getAsFileSystemHandle ? await it.getAsFileSystemHandle() : null); } catch (x) { hs.push(null); } }
  for (let i = 0; i < files.length; i++) { const h = hs[i] && hs[i].kind === 'file' ? hs[i] : null; await loadFile(h ? await h.getFile() : files[i], h); }
});
setInterval(() => { if (!document.hidden) checkWatch(); }, 4000);
render(); setLive('ok'); restore().then(() => { setLive('ok'); if (GD.on) syncDrive(true); });



return {show:function(){}};
}

 try{const res=await fetch("/.netlify/functions/tuvan",{method:"POST",headers:{"content-type":"application/json","x-access-code":code},body:JSON.stringify({prompt,docs})});
  if(res.status===401){const c=await uiPrompt("Nhập mã truy cập tư vấn do quản trị cung cấp:");if(!c)return null;try{localStorage.setItem("vpdk.code",c.trim())}catch(e){}return askServer(prompt,docs,(tries||0)+1)}

const STOP=new Set("la va cua cho cac mot nhung the nao khi de duoc co khong thi tai trong voi nay do hay can xin muon ho bi nhu minh ong ba".split(" "));
function tok(t){const words=[...new Set(fold(t).split(/[^a-z0-9]+/).filter(w=>w.length>=2&&!STOP.has(w)))],shown=[...new Set(t.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>words.includes(fold(w))))];return{words,shown}}
function rankDocs(t){const {words}=tok(t),ft=fold(t),cnt=(h,w)=>{let n=0,i=-1;while((i=h.indexOf(w,i+1))>=0&&n<50)n++;return n};
 return DATA.map(d=>{const hd=fold(d.so+" "+d.ten),bd=d.nd?fold(d.nd):"";let s=0;words.forEach(w=>{s+=cnt(hd,w)*6+Math.min(cnt(bd,w),20)});if(ft.includes(fold(d.so)))s+=60;return{d,s,bd}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s)}
function excerpt(d,t,max){const {words}=tok(t),lines=d.nd.split("\n"),fl=lines.map(fold),need=Math.min(2,words.length);
 const hit=fl.map(x=>words.filter(w=>x.includes(w)).length),idx=lines.map((_,i)=>i).filter(i=>hit[i]>=need).sort((x,y)=>hit[y]-hit[x]),sel=new Set();let tot=0;
 for(const i of idx){let st=i;for(let k=i;k>=Math.max(0,i-15);k--){if(/^\s*Điều\s+\d+/i.test(lines[k])){st=k;break}}

function buildPrompt(cat,docs,t){return "Bạn hỗ trợ cán bộ văn phòng đăng ký đất đai tại tỉnh Phú Thọ. Quy trình bắt buộc: (1) Xác định trong DANH MỤC các văn bản liên quan đến câu hỏi và dùng chúng làm căn cứ pháp lý; ưu tiên văn bản mới nhất còn hiệu lực, chú ý văn bản đã bị sửa đổi hoặc thay thế (xem cột tình trạng). (2) Chỉ ghi số điều, khoản khi chúng có trong phần TOÀN VĂN/TRÍCH, tài liệu người dùng hoặc tệp PDF đính kèm; văn bản trong danh mục chưa có toàn văn thì ghi 'cần tra toàn văn' ở trường dieu, không đoán số điều. (3) Nếu câu hỏi cần một văn bản KHÔNG có trong danh mục, không tự trích nội dung văn bản đó; ghi tên hoặc số hiệu văn bản cần tra vào mảng can_bo_sung. Không bịa. Trường so trong can_cu phải đúng số hiệu như trong danh mục. Trả về DUY NHẤT một JSON hợp lệ dạng {\"tom_tat\":string,\"huong_xu_ly\":string,\"buoc\":[{\"viec\":string,\"can_cu\":string,\"ho_so\":string,\"thoi_han\":string,\"co_quan\":string}],\"can_cu\":[{\"so\":string,\"dieu\":string,\"noi_dung\":string}],\"can_bo_sung\":[{\"ten\":string,\"ly_do\":string}],\"luu_y\":string}. Tiếng Việt, ngắn gọn.\n\nDANH MỤC:\n"+cat+"\n\nTÀI LIỆU NGƯỜI DÙNG:\n"+(docs||"(không có)")+"\n\nCÂU HỎI:\n"+t}
function offlineAdvice(t,why){

  buoc:[],can_cu:cc,can_bo_sung:scored.length?[]:[{ten:t.slice(0,140),ly_do:"Chưa có văn bản nào trong danh mục khớp với câu hỏi"}],luu_y:why||"Đang dùng tra cứu từ khóa vì chưa kết nối được Claude trên máy này.",thong_bao:"Chế độ tra cứu từ khóa"}}

    var h=document.createElement('div');h.className='mod';h.hidden=true;stage.appendChild(h);m.host=h;
    var r=h.attachShadow({mode:'open'});r.appendChild(document.getElementById(m.tpl).content.cloneNode(true));
    try{m.api=m.mount(r)}catch(e){console.error(m.id,e);r.appendChild(Object.assign(document.createElement('p'),{textContent:'Không khởi động được mục "'+m.label+'": '+e.message,style:'padding:16px'}))}
  });
  applyTheme();
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  function go(id){
    cur=id;
    MODS.forEach(function(m){var on=m.id===id;m.host.hidden=!on;m.btn.setAttribute('aria-selected',on)});
    try{localStorage.setItem('vpdk.tab',id)}catch(e){}
    var m=MODS.filter(function(x){return x.id===id})[0];
    if(m.api&&m.api.show)try{m.api.show()}catch(e){console.error(e)}
  }
  var start='bpkt';try{var s=localStorage.getItem('vpdk.tab');if(MODS.some(function(m){return m.id===s}))start=s}catch(e){}
  go(start);
})();
</script>
